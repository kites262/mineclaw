- name: look_block
  handler: look_block
  description: 读取当前对话玩家准星指向的方块类型与坐标
  parameters:
    type: object
    properties: {}
    additionalProperties: false
  enabled: true

- name: feet_block
  handler: feet_block
  description: 读取当前对话玩家脚下的方块类型与坐标
  parameters:
    type: object
    properties: {}
    additionalProperties: false
  enabled: true

- name: inventory
  handler: inventory
  description: 读取当前对话玩家的脱敏背包摘要
  parameters:
    type: object
    properties: {}
    additionalProperties: false
  enabled: true

- name: online_players
  handler: online_players
  description: 返回本轮对话发起玩家的账号名，以及当前在线玩家的账号名列表
  parameters:
    type: object
    properties: {}
    additionalProperties: false
  enabled: true

- name: list
  handler: list
  description: 列出 Mineclaw Workspace 内的文件和目录；受保护文件仅返回 path、type 与 protected 标记
  parameters:
    type: object
    properties:
      path:
        type: string
      depth:
        type: integer
        minimum: 0
      limit:
        type: integer
        minimum: 1
    additionalProperties: false
  enabled: true

- name: read
  handler: read
  description: 读取 Mineclaw Workspace 内的文本文件；config.yml 与 .env 只返回 protected 提示
  parameters:
    type: object
    properties:
      path:
        type: string
      offset:
        type: integer
        minimum: 0
      max_chars:
        type: integer
        minimum: 1
    required: [path]
    additionalProperties: false
  enabled: true

- name: grep
  handler: grep
  description: 在 Mineclaw Workspace 内按字面量搜索文本；始终跳过 config.yml 与 .env
  parameters:
    type: object
    properties:
      pattern:
        type: string
      path:
        type: string
      max_results:
        type: integer
        minimum: 1
      context_lines:
        type: integer
        minimum: 0
    required: [pattern]
    additionalProperties: false
  enabled: true

- name: run_command
  handler: run_command
  description: 按配置白名单或玩家确认流程分发命令；player 必须显式提供，null 表示控制台。dispatched 仅表示命令已提交；execution_result 为 unknown 时不得声称执行成功
  parameters:
    type: object
    properties:
      command:
        type: string
      intent:
        type: string
        description: 向确认玩家展示的简短操作说明，直接说清要做什么、由谁执行以及涉及谁
      player:
        type: [string, 'null']
    required: [command, intent, player]
    additionalProperties: false
  enabled: true
